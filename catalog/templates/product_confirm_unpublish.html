{% extends 'base.html' %}

{% block title %}Снять с публикации{% endblock %}

{% block content %}
<div class="container mt-5">
    <h1>Снять с публикации</h1>
    <p>Вы уверены, что хотите снять продукт "{{ object.name }}" с публикации?</p>
    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-warning">Снять с публикации</button>
        <a href="{% url 'product_detail' object.pk %}" class="btn btn-secondary">Отмена</a>
    </form>
</div>
{% endblock %}
